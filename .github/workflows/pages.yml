name: Deploy charts to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['out/**', 'site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build site
        run: |
          mkdir -p _site
          cp -r out _site/out
          export UPDATED="$(git log -1 --format=%cd --date=format:'%-d %B %Y' -- out)"
          python3 - <<'EOF'
          import html, json, os
          from urllib.parse import quote

          charts = []
          for file_name in sorted(os.listdir('out'), key=str.lower):
              if file_name.endswith('.png'):
                  team_name = html.escape(file_name[:-4])
                  src = 'out/' + quote(file_name)
                  charts.append(f'    <a href="{src}"><img src="{src}" alt="{team_name}" loading="lazy"></a>')

          games_played = json.load(open('out/games_played.json', encoding='utf-8'))

          page = open('site/index.html', encoding='utf-8').read()
          page = page.replace('{{updated}}', os.environ['UPDATED'])
          page = page.replace('{{games_played}}', f"{games_played['min']}-{games_played['max']}")
          page = page.replace('{{charts}}', '\n'.join(charts))
          open('_site/index.html', 'w', encoding='utf-8').write(page)
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
